interface:
  display_name: "网感口播完整制作"
  short_description: "自拍原声精剪、抖音28模块、花叔35画风、对话审核与本地出片"
  default_prompt: "使用 $talking-head-motion 完成网感口播：自拍原片保留原生画音同步粗剪，按最终词轴编排反复出镜的人物、字幕与语义动效。抖音参考按实际搜索顺序记录，逐条查看与重建，复用28个动画和版式模块；动态抠像未接入时明确限制。需要花叔风格时使用完整场景引擎及35艺术配方，按新题材构图和对象动作制作。画风由用户在对话指定，网页只展示。交付完整本地MP4及每个动画视频的审核页，当前Codex审片并修复。沿用已知配置，继续完成已授权工作。"
