interface:
  display_name: "网感口播完整制作"
  short_description: "自拍原声精剪、真人逐帧动效重建、35画风、对话审核与本地出片"
  default_prompt: "使用 $talking-head-motion 完成网感口播：自拍原片保留原生画音同步粗剪，按最终词轴编排反复出镜的人物、字幕与语义动效。抖音参考按实际搜索顺序记录；要求精细复刻时完整下载和遍历原生帧，连续实看动画，测量逐字轨迹、颜色、裁切、遮罩、层序及转场。使用移动实拍视频和实际动态alpha，按原生窗口重建，检查最终编码并提供同步原片/前后逐帧对照；机器遍历不冒充人工理解，未逐项核验不得称百分百，未知字体和隐藏素材明确报告。需要花叔风格时使用完整场景引擎及35艺术配方，按新题材构图和对象动作制作。画风由用户在对话指定，网页只展示，修改意见留在对话。交付完整本地MP4及每个动画视频的审核页，当前Codex审片并修复。沿用已知配置，继续完成已授权工作。"
