interface:
  display_name: "30款网感口播剪辑风格"
  short_description: "固定口播风格、自拍原声精剪、人物与动效编排、对话审核、本地出片"
  default_prompt: "使用 $talking-head-motion 剪辑口播。沿用用户在对话指定的TH-DY风格或名称，尚无选择时展示已有视频并提醒；Agent填写内部配方和版本锁定。自拍原画原声同步剪内容，对最终母片校字幕；按句意套用固定风格的字幕、人物窗口、证据和转场，人物承担主线并多次回归。已有配方直接复用，只有新增参考或明确精细复刻才做原生逐帧研究；艺术场景与数字人是按需分支。完整本地MP4、字幕与只读播放/逐帧对照页由当前Codex审片，选择和修改始终在对话中处理。保留实际验证范围、具体差异和上游署名，继续完成已授权工作。"
