<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:sans-serif;color:__FOREGROUND__}
#stage{position:relative;width:100%;height:100%;background:__BACKGROUND__;overflow:hidden;--accent:__ACCENT__}
.background{position:absolute;inset:0;background:__BACKGROUND__}
.presenter-wrap{position:absolute;inset:0}#presenter{width:100%;height:100%;object-fit:cover}
.graphic{position:absolute;left:6%;width:88%;z-index:2}.graphic.top{top:7%}.graphic.center{top:27%}
.graphic-inner{padding:5%;border:1px solid #ffffff24;border-radius:26px;background:#23241FF2;box-shadow:0 14px 50px #00000040;overflow:hidden}
.kicker{font-size:24px;letter-spacing:2px;color:var(--accent);margin-bottom:18px;font-weight:700;min-height:1em}
.title-mask{overflow:hidden}.hero-text{font-size:72px;line-height:1.16;font-weight:800;letter-spacing:-2px;margin:0;overflow-wrap:anywhere}
.section-title{font-size:38px;line-height:1.3;margin:0 0 24px;overflow-wrap:anywhere}
.step-list{display:flex;flex-direction:column;gap:16px}.step{display:flex;align-items:center;gap:24px;font-size:32px;line-height:1.35;padding:20px;background:#ffffff0B;border-radius:18px;overflow-wrap:anywhere}
.step-number{font-size:28px;flex-shrink:0;color:var(--accent);font-weight:800}.quote-mark{font-size:100px;line-height:.8;color:var(--accent)}
.quote-text{font-size:50px;line-height:1.35;margin:18px 0 4px;overflow-wrap:anywhere}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.alternative{font-size:32px;line-height:1.45;min-height:150px;padding:24px;background:#ffffff0A;border-radius:18px;overflow-wrap:anywhere}
.highlighted{color:var(--accent);border:1px solid var(--accent)}.image-mask{overflow:hidden;border-radius:16px;background:#23241F}.evidence-image{display:block;width:100%;max-height:calc(var(--stage-height)*.25);object-fit:contain}
.broll-video{display:block;width:100%;height:calc(var(--stage-height)*.42);object-fit:contain}.evidence-caption{font-size:24px;line-height:1.4;margin:16px 0 0;color:#D0D7E0;overflow-wrap:anywhere}
.caption{position:absolute;bottom:8%;left:6%;width:88%;z-index:4;text-align:center}.caption-inner{display:inline-block;max-width:100%;padding:16px 24px;font-size:48px;line-height:1.4;font-weight:700;color:#FFFFFF;background:#080C12ED;border-radius:14px;overflow-wrap:anywhere}
.footer{position:absolute;bottom:2.5%;left:6%;font-size:20px;letter-spacing:2px;color:#DDE2E8;background:#080C12ED;padding:8px 12px;border-radius:8px;z-index:1}
.audio-only .graphic.center{top:24%}
.audio-only .kinetic-title,.audio-only .quote{background:transparent;border:0;box-shadow:none;padding:3%}
.audio-only .hero-text{font-size:128px;line-height:1.18}
.audio-only .quote-text{font-size:84px}
.audio-only .section-title{font-size:54px}
.audio-only .alternative{font-size:48px;min-height:240px}
.audio-only .broll-video{height:auto;max-height:calc(var(--stage-height)*.5)}
.graphic.full{inset:0;width:100%;height:100%}.graphic.full .graphic-inner{padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;width:100%;height:100%}.graphic.full .broll-video{width:100%;height:100%;max-height:none;object-fit:contain}
